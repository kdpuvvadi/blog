name: build

on:
  workflow_dispatch:
  release:
  push:
    branches:
      - main
      - 'releases/**'

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y binfmt-support
          curl -L -o /tmp/qemu.sh 'https://raw.githubusercontent.com/qemu/qemu/master/scripts/qemu-binfmt-conf.sh'
          chmod +x /tmp/qemu.sh
          sudo /tmp/qemu.sh --debian

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Get commit short sha
        id: vars
        run: |
          shortSha=$(git rev-parse --short ${{ github.sha }})
          echo "::set-output name=short_sha::$shortSha"

      - name: Log into github
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log into gitea
        uses: docker/login-action@v4
        with:
          registry: git.dns.puvvadi.net
          username: ${{ vars.FORGEJO_USER }}
          password: ${{ secrets.FORGEJO_TOKEN }}

      - name: Log into registry docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image to docker, github hub
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ github.repository	}}:${{ steps.vars.outputs.short_sha }}
            ghcr.io/${{ github.repository	}}:${{ steps.vars.outputs.short_sha }}
            ${{ github.repository	}}:latest
            ghcr.io/${{ github.repository	}}:latest
            git.dns.puvvadi.net/kd/blog:${{ steps.vars.outputs.short_sha }}
            git.dns.puvvadi.net/kd/blog:latest
          cache-from: type=registry,ref=${{ github.repository	}}:latest
          cache-to: type=inline
